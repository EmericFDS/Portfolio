<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Introuvable | Emeric FDS</title>
    <meta name="robots" content="noindex, follow">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Deferred Google Analytics -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var gtmLoaded = false;
            function loadGTM() {
                if (gtmLoaded) return;
                gtmLoaded = true;

                var script = document.createElement("script");
                script.src = "https://www.googletagmanager.com/gtag/js?id=G-H7GJV51SW0";
                script.async = true;
                document.head.appendChild(script);

                window.dataLayer = window.dataLayer || [];
                function gtag() { dataLayer.push(arguments); }
                gtag('js', new Date());
                gtag('config', 'G-H7GJV51SW0');
            }

            // Load on interaction or after delay
            window.addEventListener('scroll', loadGTM, { once: true });
            window.addEventListener('mousemove', loadGTM, { once: true });
            window.addEventListener('touchstart', loadGTM, { once: true });
            setTimeout(loadGTM, 4000); // Fallback
        });
    </script>

    <style>
        .error-container {
            grid-column: span 10;
            grid-row: span 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
            min-height: 60vh;
        }

        .error-code {
            font-family: var(--font-heading);
            font-size: 8rem;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, var(--accent), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1rem;
        }

        .error-message {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 2rem;
        }

        .back-btn {
            background: var(--accent);
            color: #000;
            padding: 1rem 2rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
        }
    </style>
</head>

<body>
    <div class="background-glob"></div>
    <div class="background-grid"></div>

    <main class="bento-wrapper">
        <div class="bento-grid">
            <div class="bento-card error-container">
                <h1 class="error-code">404</h1>
                <p class="error-message">Oups ! Cette page s'est perdue dans le cyberespace.</p>
                <a href="/" class="back-btn">
                    <i class="fas fa-home"></i> Retour à l'accueil
                </a>
            </div>
        </div>
    </main>
</body>

</html>
